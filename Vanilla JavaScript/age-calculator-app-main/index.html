<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Age calculator app</title>
  <link rel="stylesheet" href="style.css">
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
    <main class="calculator-container">
         <form class="age-form">
          <div class="inputs-container">
                 <div class="input-grp">
                 <label for="day">Day</label>
                 <input type="number" id="day" placeholder="DD">
                 <span class="error-msg">This field is required</span>
             </div>
             <div class="input-grp">
                 <label for="month">Month</label>
                 <input type="number" id="month" placeholder="MM">
                 <span class="error-msg">This field is required</span>
             </div>
              <div class="input-grp">
                 <label for="year">Year</label>
                 <input type="number" id="year" placeholder="YYYY">
                 <span class="error-msg">This field is required</span>
              </div>
          </div>
            
              <div class="divider">
                <hr>
                <button type="submit" aria-label="Calculate Age">
                      <img src="./assets/images/icon-arrow.svg" alt="arrow">
                </button>
              </div>
              <div class="result-display">
                <p><span id="years-res">--</span>years</p>
                <p><span id="month-res">--</span>months</p>
                <p><span id="day-res">--</span>days</p>
              </div>
         </form>
    </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Fariha Zehra</a>.
  </footer>
  <script src="script.js"></script>
</body>
</html>
